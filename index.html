<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polish Learning Flashcards</title>
    <style>
        :root { --primary: #dc143c; --secondary: #f0f0f0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #fafafa; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        #menu { margin-bottom: 30px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .menu-btn { padding: 10px 20px; border: none; background: white; border-bottom: 3px solid var(--primary); cursor: pointer; font-weight: bold; transition: 0.3s; }
        .menu-btn:hover { background: var(--primary); color: white; }

        .flashcard-container { width: 350px; height: 200px; perspective: 1000px; cursor: pointer; margin-bottom: 20px; }
        .flashcard { width: 100%; height: 100%; position: relative; transition: transform 0.6s; transform-style: preserve-3d; text-align: center; }
        .flashcard.flipped { transform: rotateY(180deg); }
        
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; 
                     padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-size: 1.5rem; box-sizing: border-box; }
        .front { background: white; color: #333; border: 2px solid var(--primary); }
        .back { background: var(--primary); color: white; transform: rotateY(180deg); }

        .controls { display: flex; gap: 20px; align-items: center; }
        button.nav { padding: 10px 25px; border-radius: 25px; border: none; background: #333; color: white; cursor: pointer; }
        #counter { font-weight: bold; color: #666; }
    </style>
</head>
<body>

    <h1>Вивчення Польської A1</h1>
    <div id="menu"></div>

    <div id="game-area" style="display:none;">
        <div class="flashcard-container" onclick="flipCard()">
            <div id="card" class="flashcard">
                <div class="card-face front" id="pl-text">Cześć!</div>
                <div class="card-face back" id="ua-text">Привіт!</div>
            </div>
        </div>

        <div class="controls">
            <button class="nav" onclick="prevCard()">← Назад</button>
            <span id="counter">0 / 0</span>
            <button class="nav" onclick="nextCard()">Далі →</button>
        </div>
    </div>

    <script>
        // Список ваших файлів
        const files = [
            'PL A1_0001_0029_POWITANIA.txt',
            'PL A1_0030_0050_LICZBY.txt',
            'PL A1_0051_0135_OSOBY. NAPISY.txt'
        ];

        let currentWords = [];
        let currentIndex = 0;

        // Ініціалізація меню
        const menu = document.getElementById('menu');
        files.forEach(file => {
            const btn = document.createElement('button');
            btn.className = 'menu-btn';
            btn.innerText = file.replace('.txt', '').replace(/_/g, ' ');
            btn.onclick = () => loadFile(file);
            menu.appendChild(btn);
        });

        async function loadFile(fileName) {
            try {
                const response = await fetch(fileName);
                const text = await response.text();
                parseData(text);
                currentIndex = 0;
                showCard();
                document.getElementById('game-area').style.display = 'block';
            } catch (err) {
                alert('Помилка завантаження файлу. Переконайтеся, що файл знаходиться в тій же папці.');
            }
        }

        function parseData(text) {
            currentWords = text.split('\n')
                .filter(line => line.includes('/') || line.includes(' / '))
                .map(line => {
                    // Видаляємо за допомогою регулярного виразу
                    const cleanLine = line.replace(/\/g, '').trim();
                    const parts = cleanLine.split(/\s*\/\s*/);
                    return { pl: parts[0], ua: parts[1] };
                })
                .filter(word => word.pl && word.ua);
        }

        function showCard() {
            const card = document.getElementById('card');
            card.classList.remove('flipped');
            if (currentWords.length > 0) {
                document.getElementById('pl-text').innerText = currentWords[currentIndex].pl;
                document.getElementById('ua-text').innerText = currentWords[currentIndex].ua;
                document.getElementById('counter').innerText = `${currentIndex + 1} / ${currentWords.length}`;
            }
        }

        function flipCard() {
            document.getElementById('card').classList.toggle('flipped');
        }

        function nextCard() {
            if (currentIndex < currentWords.length - 1) {
                currentIndex++;
                showCard();
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                showCard();
            }
        }
    </script>
</body>
</html>
