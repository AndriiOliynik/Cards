<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App Pro</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; margin-top: 30px; padding-bottom: 50px; }
        button { margin: 5px; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button.answerBtn { background-color: lightgray; min-width: 120px; }
        .mode-btn { background-color: #f0f0f0; border: 1px solid #ccc; }
        #timerDisplay { font-weight: bold; font-size: 22px; color: #e67e22; margin: 10px; display: none; }
        input[type="text"] { padding: 12px; font-size: 18px; border-radius: 8px; border: 2px solid #ccc; width: 280px; outline: none; }
        
        .card-scene { width: 320px; height: 200px; perspective: 1000px; margin: 20px; }
        .card { width: 100%; height: 100%; position: relative; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; }
        .card.is-flipped { transform: rotateY(180deg); }
        .card__face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold; border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15); border: 3px solid #4CAF50;
            padding: 20px; text-align: center; background: white; box-sizing: border-box;
        }
        .card__face--back { background: #f9fbf9; color: #2e7d32; transform: rotateY(180deg); border-color: #2196F3; }
        .nav-controls { margin-top: 20px; display: flex; gap: 10px; }
        
        /* Контейнер помилки */
        .error-hint { background: #ffebee; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 16px; text-align: center; font-weight: bold; border: 2px solid #d32f2f; width: 280px;}
        
        /* Кольори для слів у повідомленні */
        .txt-red { color: #d32f2f; }
        .txt-black { color: black; }
        .txt-purple { color: #8e24aa; text-decoration: underline; }
        
        .missing-word { font-size: 28px; letter-spacing: 4px; margin-bottom: 15px; color: #2c3e50; font-family: monospace; }
        #feedback { min-height: 40px; margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
    </style>
    <script>
        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let scoreError = 0;
        let voices = [];
        let selectedVoiceIndex = 0;
        let speechRate = 1;
        let QRate = 3500;
        let swapped = false;
        let inputMode = false;
        let timer = null;
        let timeLeft = 60;
        let currentMode = 'standard';

        function populateVoices() {
            voices = window.speechSynthesis.getVoices();
            const voiceSelect = document.getElementById('voiceSelect');
            if (!voiceSelect) return;
            voiceSelect.innerHTML = '';
            voices.forEach((v, i) => {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `${v.name} (${v.lang})`;
                if (v.lang.includes('pl')) opt.selected = true;
                voiceSelect.appendChild(opt);
            });
            selectedVoiceIndex = voiceSelect.value;
        }
        window.speechSynthesis.onvoiceschanged = populateVoices;

        function speakText(text) {
            if (!text) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            if (voices[selectedVoiceIndex]) utterance.voice = voices[selectedVoiceIndex];
            utterance.lang = 'pl-PL';
            utterance.rate = speechRate;
            window.speechSynthesis.speak(utterance);
        }

        function normalize(str) {
            if(!str) return "";
            return str.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()"'?]/g, "").replace(/\s+/g, " ").trim();
        }

        function loadQuestionsFromTxt(file) {
            file.text().then(text => {
                questions = text.trim().split('\n').filter(l => l.includes(';') || l.includes('/')).map(line => {
                    let delimiter = line.includes(';') ? ';' : '/';
                    const parts = line.split(delimiter);
                    return { word: parts[0].trim(), translation: parts[1].trim() };
                });
                document.querySelectorAll('.mode-btn').forEach(b => b.disabled = false);
            });
        }

        function setMode(mode, hasTimer = false) {
            resetAllInternal();
            currentMode = mode;
            if (hasTimer) {
                timeLeft = 60;
                document.getElementById('timerDisplay').style.display = 'block';
                timer = setInterval(() => {
                    timeLeft--;
                    document.getElementById('timerDisplay').innerText = "Час: " + timeLeft;
                    if (timeLeft <= 0) { clearInterval(timer); alert("Час вийшов!"); resetAllInternal(); }
                }, 1000);
            }
            displayQuestion();
        }

        function getWordWithMissingChars(word) {
            let result = word.split('');
            let countToHide = Math.ceil(word.length * 0.3);
            if (countToHide < 1 && word.length > 1) countToHide = 1;
            let indices = [];
            while(indices.length < countToHide) {
                let r = Math.floor(Math.random() * word.length);
                if(word[r] !== ' ' && !indices.includes(r)) indices.push(r);
            }
            indices.forEach(idx => result[idx] = '_');
            return result.join('');
        }

        function displayQuestion() {
            const container = document.getElementById('questionContainer');
            if (!questions.length) return;
            if (currentQuestionIndex >= questions.length) {
                container.innerHTML = `<h3>Кінець списку! ✅</h3><button onclick="currentQuestionIndex=0; displayQuestion()">Почати спочатку</button>`;
                return;
            }
            const q = questions[currentQuestionIndex];
            const qText = swapped ? q.translation : q.word; 
            const aText = swapped ? q.word : q.translation; 
            if (!swapped && currentMode !== 'fillGaps') speakText(qText);
            
            let contentHtml = "";
            const isHintActive = document.getElementById('hintToggle')?.checked;
            const placeholderText = isHintActive ? aText : "";

            if (currentMode === 'fillGaps') {
                const targetWord = q.word;
                const displayWord = getWordWithMissingChars(targetWord);
                contentHtml = `<h3>Переклад: ${q.translation}</h3><div class="missing-word">${displayWord}</div><input type="text" id="userInput" autofocus autocomplete="off" placeholder="${isHintActive ? targetWord : 'Впишіть слово повністю'}" onkeypress="if(event.key==='Enter') checkInput('${targetWord}')" onblur="this.focus()"><button id="actionBtn" onclick="checkInput('${targetWord}')">Ок</button>`;
            } else if (currentMode === 'flashcard') {
                contentHtml = `<div class="card-scene"><div class="card" onclick="this.classList.toggle('is-flipped'); if(this.classList.contains('is-flipped') && swapped) speakText('${aText}')"><div class="card__face card__face--front">${qText}</div><div class="card__face card__face--back">${aText}</div></div></div>`;
            } else if (currentMode === 'trueFalse') {
                const isCorrect = Math.random() > 0.5;
                const displayA = isCorrect ? aText : (swapped ? questions[Math.floor(Math.random()*questions.length)].word : questions[Math.floor(Math.random()*questions.length)].translation);
                contentHtml = `<h3>${qText} = ${displayA}?</h3><button class="answerBtn" onclick="checkTF(this, ${isCorrect}, true, '${aText}')">Правда</button><button class="answerBtn" onclick="checkTF(this, ${isCorrect}, false, '${aText}')">Неправда</button>`;
            } else {
                contentHtml = `<h3>${qText}</h3>`;
                if (inputMode) {
                    contentHtml += `<input type="text" id="userInput" autofocus autocomplete="off" placeholder="${placeholderText}" onkeypress="if(event.key==='Enter') checkInput('${aText}')" onblur="this.focus()"><button id="actionBtn" onclick="checkInput('${aText}')">Ок</button>`;
                } else {
                    let opts = [aText];
                    while(opts.length < 4 && opts.length < questions.length) {
                        let r = swapped ? questions[Math.floor(Math.random()*questions.length)].word : questions[Math.floor(Math.random()*questions.length)].translation;
                        if(!opts.includes(r)) opts.push(r);
                    }
                    opts.sort(() => Math.random() - 0.5);
                    opts.forEach(o => { contentHtml += `<button class="answerBtn" onclick="checkBtn(this, '${aText}')">${o}</button>`; });
                }
            }
            contentHtml += `<div id="feedback"></div>`;
            const navHtml = `<div class="nav-controls"><button onclick="prevQ()">⬅ Назад</button><button onclick="nextQ()">Вперед ➡</button></div>`;
            container.innerHTML = contentHtml + (currentMode.includes('sprint') ? "" : navHtml);
            updateScore();
            if (inputMode || currentMode === 'fillGaps') setTimeout(() => document.getElementById('userInput')?.focus(), 50);
        }

        function getColoredError(correct) {
            return `<div class="error-hint">
                        <span class="txt-red">Невірно!</span> 
                        <span class="txt-black">Правильно:</span> 
                        <span class="txt-purple">${correct}</span>
                    </div>`;
        }

        function checkInput(correct) {
            const input = document.getElementById('userInput');
            const feedback = document.getElementById('feedback');
            const btn = document.getElementById('actionBtn');
            if (normalize(input.value) === normalize(correct)) {
                input.style.backgroundColor = "#2e7d32"; input.style.color = "white";
                score++; updateScore(); speakText(correct);
                setTimeout(nextQ, 1000);
            } else {
                input.style.backgroundColor = "#d32f2f"; input.style.color = "white";
                feedback.innerHTML = getColoredError(correct);
                scoreError++; updateScore(); speakText(correct);
                btn.innerText = "Далі"; btn.onclick = nextQ;
            }
        }

        function checkTF(btn, isCorrect, userChoice, correctText) {
            const feedback = document.getElementById('feedback');
            if (isCorrect === userChoice) { 
                btn.style.backgroundColor = "#2e7d32"; btn.style.color = "white";
                score++; setTimeout(nextQ, 1000); 
            } else { 
                btn.style.backgroundColor = "#d32f2f"; btn.style.color = "white";
                feedback.innerHTML = getColoredError(correctText);
                scoreError++; updateScore();
                if(!document.getElementById('manualNext')) {
                   feedback.innerHTML += `<button id="manualNext" onclick="nextQ()" style="margin-top:10px; background:#555; color:white;">Наступне</button>`;
                }
            }
            if (swapped) speakText(correctText);
        }

        function checkBtn(btn, correct) {
            const feedback = document.getElementById('feedback');
            if (normalize(btn.innerText) === normalize(correct)) { 
                btn.style.backgroundColor = "#2e7d32"; btn.style.color = "white";
                score++; setTimeout(nextQ, currentMode === 'sprint' ? 400 : QRate/4); 
            } else { 
                btn.style.backgroundColor = "#d32f2f"; btn.style.color = "white";
                feedback.innerHTML = getColoredError(correct);
                scoreError++; updateScore();
                if(!document.getElementById('manualNext')) {
                   feedback.innerHTML += `<button id="manualNext" onclick="nextQ()" style="margin-top:10px; background:#555; color:white;">Наступне</button>`;
                }
            }
            if (swapped) speakText(correct);
        }

        function nextQ() { currentQuestionIndex++; displayQuestion(); }
        function prevQ() { if(currentQuestionIndex > 0) { currentQuestionIndex--; displayQuestion(); } }
        function resetAllInternal() {
            clearInterval(timer); window.speechSynthesis.cancel();
            currentQuestionIndex = 0; score = 0; scoreError = 0;
            document.getElementById('timerDisplay').style.display = 'none';
            document.getElementById('questionContainer').innerHTML = ''; updateScore();
        }
        function swapLive() { swapped = !swapped; displayQuestion(); }
        function toggleInputMode() { inputMode = !inputMode; displayQuestion(); }
        function updateScore() { document.getElementById('score').innerHTML = `✅ ${score} | ❌ <span style="color:red">${scoreError}</span> | Питання: ${currentQuestionIndex + 1}/${questions.length}`; }
        function changeVoice(v) { selectedVoiceIndex = v; }
        function changeRate(v) { speechRate = v; }
        function changeQRate(v) { QRate = v; }
    </script>
</head>
<body>
    <input type="file" accept=".txt" onchange="loadQuestionsFromTxt(this.files[0])">
    <div style="margin: 10px 0;">
        <button class="mode-btn" onclick="setMode('standard')" disabled>Стандарт</button>
        <button class="mode-btn" onclick="setMode('fillGaps')" disabled>Вставити букви</button>
        <button class="mode-btn" onclick="setMode('sprint', true)" disabled>Спринт (60с)</button>
        <button class="mode-btn" onclick="setMode('sprint', false)" disabled>Спринт (∞)</button>
        <button class="mode-btn" onclick="setMode('flashcard')" disabled>Картки</button>
        <button class="mode-btn" onclick="setMode('trueFalse')" disabled>Так/Ні</button>
    </div>
    <div id="timerDisplay">Час: 60</div>
    <div style="padding: 10px; background: #eee; border-radius: 10px; margin-bottom: 10px;">
        <button onclick="resetAllInternal()">Скинути все</button>
        <button onclick="swapLive()" style="background: #e1f5fe;">Swap (Мова ⇄)</button>
        <button onclick="toggleInputMode()" style="background: #fff3e0;">Кнопки ⇄ Ввід</button>
        <label style="margin-left: 10px; cursor: pointer; font-size: 14px;">
            <input type="checkbox" id="hintToggle" onchange="displayQuestion()"> Підказка в полі
        </label>
    </div>
    <div id="score" style="font-size: 20px; font-weight: bold; margin: 15px;">✅ 0 | ❌ 0 | Питання: 0/0</div>
    <div id="questionContainer"></div>
    <hr style="width: 80%; margin: 30px;">
    <div style="font-size: 14px; background: #fafafa; padding: 15px; border-radius: 10px; width: 320px;">
        <label>Голос: <select id="voiceSelect" onchange="changeVoice(this.value)"></select></label><br><br>
        <label>Швидкість озвучки: <input type="range" min="0.5" max="2" value="1" step="0.1" oninput="changeRate(this.value)"></label><br><br>
        <label>Затримка авто-переходу: <input type="range" min="500" max="15000" value="3500" step="500" oninput="changeQRate(this.value)"></label>
    </div>
</body>
</html>
